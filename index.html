<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeScript Calculator</title>
</head>
<body>
  <h1>Calculator</h1>
  <input type="number" id="num1" placeholder="First number" />
  <select id="operation" aria-label="Select operation">
    <option value="+">+</option>
    <option value="-">−</option>
    <option value="*">×</option>
    <option value="/">÷</option>
  </select>
  <input type="number" id="num2" placeholder="Second number" />
  <button type="button" id="btnCalculate">Calculate</button>
  <p>Result: <strong id="result">—</strong></p>

  <!-- Compiled TypeScript scripts -->
  <script src="sum.js"></script>
  <script src="subtract.js"></script>
  <script src="multiply.js"></script>
  <script src="divide.js"></script>
  <script>
    document.getElementById('btnCalculate').addEventListener('click', function () {
      var a = Number(document.getElementById('num1').value);
      var b = Number(document.getElementById('num2').value);
      var op = document.getElementById('operation').value;
      var resultElement = document.getElementById('result');

      try {
        var res;
        switch (op) {
          case '+':
            res = window.sum(a, b);
            break;
          case '-':
            res = window.subtract(a, b);
            break;
          case '*':
            res = window.multiply(a, b);
            break;
          case '/':
            res = window.divide(a, b);
            break;
          default:
            res = 'Unknown operation';
        }
        resultElement.textContent = res;
      } catch (error) {
        resultElement.textContent = error instanceof Error ? error.message : String(error);
      }
    });
  </script>
</body>
</html>
